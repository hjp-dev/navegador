<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self'">
  <title>Navegador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chrome">
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="new-tab" class="icon" title="Nueva pestaña (Ctrl+T)">＋</button>
  </div>

  <div id="navbar">
    <button id="back" class="icon" title="Atrás (Alt+←)">←</button>
    <button id="forward" class="icon" title="Adelante (Alt+→)">→</button>
    <button id="reload" class="icon" title="Recargar (Ctrl+R)">↻</button>
    <form id="address-form">
      <input id="address" type="text" spellcheck="false" placeholder="Busca o escribe una dirección">
      <button id="star" type="button" class="icon" title="Añadir a favoritos (Ctrl+D)">☆</button>
    </form>
    <button id="menu-btn" class="icon" title="Menú">⋮</button>
  </div>

  <div id="app-menu" hidden>
    <button data-act="tabs">🗂 Ver todas las pestañas <span class="sc">Ctrl+Shift+Tab</span></button>
    <div class="sep"></div>
    <button data-act="antenas">📡 Antenas <span class="sc">Ctrl+Shift+U</span></button>
    <button data-act="favoritos">★ Favoritos <span class="sc">Ctrl+Shift+O</span></button>
    <button data-act="descargas">⤓ Descargas <span class="sc">Ctrl+J</span></button>
    <button data-act="contrasenas">🔑 Contraseñas <span class="sc">Ctrl+Shift+P</span></button>
    <div class="sep"></div>
    <button data-act="fullscreen">⛶ Pantalla completa <span class="sc">F11</span></button>
    <button data-act="navbar">▭ Ocultar/mostrar barra <span class="sc">Ctrl+Shift+B</span></button>
  </div>

  <div id="infobar" hidden>
    <span id="infobar-text"></span>
    <button id="pw-save" class="primary">Guardar</button>
    <button id="pw-never" class="text">Nunca para este sitio</button>
    <button id="pw-dismiss" class="icon" title="Cerrar">✕</button>
  </div>
  </div>

  <aside id="panel" hidden>
    <header>
      <h2 id="panel-title"></h2>
      <button id="panel-clear" class="text" hidden>Limpiar</button>
      <button id="panel-close" class="icon" title="Cerrar">✕</button>
    </header>
    <ul id="panel-list"></ul>
    <p id="panel-empty" hidden></p>
  </aside>

  <div id="tab-overview" hidden>
    <div class="to-header">
      <h2>Pestañas abiertas</h2>
      <span class="dv-spacer"></span>
      <button id="to-new" class="text">＋ Nueva pestaña</button>
      <button id="to-close" class="icon" title="Cerrar (Esc)">✕</button>
    </div>
    <div id="to-grid"></div>
  </div>

  <div id="devices-view" hidden>
    <div class="dv-header">
      <h2>Antenas Ubiquiti</h2>
      <button id="dv-scan" class="primary">Buscar equipos</button>
      <input id="dv-range" type="text" spellcheck="false" placeholder="Subred: 10.0.0.0/24" title="Escanear un rango (sirve a través del túnel VPN)">
      <button id="dv-scan-range" class="text">Escanear subred</button>
      <button id="dv-status" class="text">Obtener señal/CCQ</button>
      <details id="dv-cols">
        <summary>Columnas ▾</summary>
        <div id="dv-cols-list"></div>
      </details>
      <span id="dv-count"></span>
      <span class="dv-spacer"></span>
      <button id="dv-close" class="icon" title="Cerrar">✕</button>
    </div>
    <div id="dv-body">
      <table id="dv-table">
        <thead><tr id="dv-head"></tr></thead>
        <tbody id="dv-rows"></tbody>
      </table>
      <p id="dv-empty" hidden></p>
    </div>
  </div>

  <div id="modal" hidden>
    <form id="auth-form">
      <h2>Iniciar sesión</h2>
      <p id="auth-origin"></p>
      <p id="auth-error" hidden>Usuario o contraseña incorrectos. Inténtalo de nuevo.</p>
      <label>Usuario <input id="auth-user" type="text" spellcheck="false" autocomplete="off"></label>
      <label>Contraseña <input id="auth-pass" type="password"></label>
      <label class="check"><input id="auth-remember" type="checkbox" checked> Recordar usuario y contraseña</label>
      <div class="buttons">
        <button id="auth-cancel" type="button" class="text">Cancelar</button>
        <button type="submit" class="primary">Iniciar sesión</button>
      </div>
    </form>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
