name: Instaladores

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Etiqueta del Release a publicar (p. ej. v1.0.0). Vacío = no publicar Release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Setup-Windows
          path: dist/*.exe

      # Se publica un Release al subir una etiqueta vX.Y.Z, o al lanzarlo a mano con release_tag.
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Infinity ${{ inputs.release_tag || github.ref_name }}
          files: dist/*.exe

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx electron-builder --linux deb AppImage --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Ubuntu
          path: |
            dist/*.deb
            dist/*.AppImage

      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Infinity ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/*.deb
            dist/*.AppImage
