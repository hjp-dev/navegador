name: Instaladores

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Etiqueta del Release a publicar (p. ej. v1.0.0). Vacío = no publicar Release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Setup-Windows
          path: dist/*.exe

      # Notas de versión: usa .github/release-notes/<tag>.md si existe; si no, un texto por defecto.
      - name: Preparar notas de versión
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" release-notes.md; else printf "Instaladores de %s.\n" "$TAG" > release-notes.md; fi

      # Se publica un Release al subir una etiqueta vX.Y.Z, o al lanzarlo a mano con release_tag.
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Infinity ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: dist/*.exe

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx electron-builder --linux deb AppImage --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-Ubuntu
          path: |
            dist/*.deb
            dist/*.AppImage

      # Notas de versión: usa .github/release-notes/<tag>.md si existe; si no, un texto por defecto.
      - name: Preparar notas de versión
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" release-notes.md; else printf "Instaladores de %s.\n" "$TAG" > release-notes.md; fi

      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Infinity ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.deb
            dist/*.AppImage
